name: publish

on:
  push:
    # Every tag, so scripts/release-target.mjs can reject a wrong one
    # (such as v0.2.0) with a message instead of never running.
    tags: ['**']

permissions:
  contents: write # gh release create
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # The runner's system Python refuses pip installs (PEP 668); a set-up Python takes them.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: target
        run: node scripts/release-target.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      # A package whose tests need Python libraries lists them in requirements.txt.
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        working-directory: ${{ steps.target.outputs.dir }}
      # ubuntu-latest ships Google Chrome at /usr/bin/google-chrome.
      - run: npm test
        working-directory: ${{ steps.target.outputs.dir }}
      - run: npm publish
        working-directory: ${{ steps.target.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Watchers' feeds and the repo sidebar show releases, not tags. The notes are
      # this version's section of the package's CHANGELOG.md.
      - run: |
          awk -v v="## ${{ steps.target.outputs.version }}" '$0==v{f=1;next} /^## /{f=0} f' "${{ steps.target.outputs.dir }}/CHANGELOG.md" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "${{ steps.target.outputs.name }} ${{ steps.target.outputs.version }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
