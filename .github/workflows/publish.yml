name: publish

on:
  push:
    # Every tag, so scripts/release-target.mjs can reject a wrong one
    # (such as v0.2.0) with a message instead of never running.
    tags: ['**']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - id: target
        run: node scripts/release-target.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      # ubuntu-latest ships Google Chrome at /usr/bin/google-chrome.
      - run: npm test
        working-directory: ${{ steps.target.outputs.dir }}
      - run: npm publish
        working-directory: ${{ steps.target.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
