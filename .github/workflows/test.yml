name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "test/*.test.mjs"

  page-as-data:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/page-as-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # ubuntu-latest ships Google Chrome at /usr/bin/google-chrome.
      - run: npm test

  drawing-architecture-diagrams:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    defaults:
      run:
        working-directory: packages/drawing-architecture-diagrams
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Rendering needs draw.io desktop, which CI does not have; lint and install run.
      - run: npm test

  writing-design-documents:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    defaults:
      run:
        working-directory: packages/writing-design-documents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      # finalize needs Microsoft Word on Windows, which CI does not have; build, check and install run.
      - run: npm test

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The design document showcase reruns the real check, which needs python-docx.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r packages/writing-design-documents/requirements.txt
      - run: pnpm --filter @keenskills/site test
      - run: pnpm --filter @keenskills/site test:showcases
      - run: pnpm --filter @keenskills/site build
      - run: pnpm --filter @keenskills/site test:pages
      - run: pnpm --filter @keenskills/site test:interactions
      # ubuntu-latest ships Google Chrome at /usr/bin/google-chrome.
      - run: pnpm --filter @keenskills/site self-check
